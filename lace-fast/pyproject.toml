[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lace-fast"
version = "2.0.0"
description = "Fast SuperTranscript construction — rewrite of Lace 1.14.1"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.12"
authors = [
    {name = "Anthony Hawkins (original Lace)"},
]
dependencies = [
    "pandas>=2.2",
    "networkx>=3.4",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.scripts]
lace-fast = "lace_fast.run:main"
build-supertranscript = "lace_fast.build_supertranscript:main"

[tool.setuptools.packages.find]
include = ["lace_fast*"]
